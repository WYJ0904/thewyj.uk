def qa = new File(System.getProperty('finance.p02.root'))
allprojects { p ->
    if (p.path == ':app') {
        p.plugins.withId('com.android.application') {
            p.androidComponents.finalizeDsl { dsl ->
                dsl.sourceSets.getByName('test').java.srcDir(new File(qa, 'kotlin'))
            }
        }
        p.tasks.configureEach { task ->
            if (task.name == 'compileDebugUnitTestKotlin') {
                task.source(p.fileTree(new File(qa, 'kotlin')) { include '**/*.kt' })
            }
        }
    }
}
