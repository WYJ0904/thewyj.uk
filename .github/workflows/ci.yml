name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-tests:
    name: Python syntax and unittest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Python download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-downloads-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-downloads-

      - name: Check Python syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            python -m compileall -q local-backend scripts qa
            echo "Python syntax check passed."
          } 2>&1 | tee artifacts/python-syntax.log

      - name: Run Python unittest suite
        run: |
          set -euo pipefail
          cd local-backend
          python -m unittest discover -p "test_*.py" -v 2>&1 | tee ../artifacts/python-unittest.log

      - name: Test CI service readiness helper
        run: |
          set -euo pipefail
          python -m unittest scripts.test_wait_for_http_services -v 2>&1 | tee artifacts/ci-readiness.log

      - name: Test Task 11 migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_task11_to_d1 -v 2>&1 | tee artifacts/task11-migration-tool.log

      - name: Test Task 12 migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_task12_accounts_to_d1 -v 2>&1 | tee artifacts/task12-migration-tool.log

      - name: Test Task 13 migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_task13_memberships_payments -v 2>&1 | tee artifacts/task13-migration-tool.log

      - name: Test Task 14 migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_task14_temporary_to_d1_r2 -v 2>&1 | tee artifacts/task14-migration-tool.log

      - name: Test Task 15 remaining-data migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_task15_remaining_to_d1 -v 2>&1 | tee artifacts/task15-migration-tool.log

      - name: Test Task 16 DailyPayGuard migration tooling
        run: |
          set -euo pipefail
          python -m unittest scripts.test_migrate_dailypayguard_finance -v 2>&1 | tee artifacts/task16-migration-tool.log

      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-reports-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  javascript-static-tests:
    name: JavaScript and static site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Node download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-downloads-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-downloads-

      - name: Install pinned Cloudflare development tooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            node --check app.js
            while IFS= read -r module; do node --check "$module"; done < <(find js -type f -name '*.js' -print | sort)
            node --check tools.js
            node --check workflows.js
            node --check learning-sync.js
            node --check sw.js
            node --check functions/_middleware.js
            while IFS= read -r module; do node --check "$module"; done < <(find functions/_lib -type f -name '*.mjs' -print | sort)
            node --check "functions/api/[[path]].js"
            node --check functions/api/status.js
            node --check local-backend/test_tools_js.mjs
            node --check local-backend/test_core_js.mjs
            node --check local-backend/test_language_js.mjs
            node --check local-backend/test_membership_js.mjs
            node --check local-backend/test_workflows_js.mjs
            node --check local-backend/test_learning_sync_js.mjs
            node --check local-backend/test_proxy_js.mjs
            node --check local-backend/test_cloudflare_foundation_js.mjs
            node --check local-backend/test_task11_model_js.mjs
            node --check local-backend/test_task11_api_js.mjs
            node --check local-backend/test_task11_d1_js.mjs
            node --check local-backend/test_task12_d1_js.mjs
            node --check local-backend/test_task13_d1_js.mjs
            node --check local-backend/test_task14_d1_js.mjs
            node --check local-backend/test_task15_d1_js.mjs
            node --check local-backend/test_task15_cloud_only_gate.mjs
            node --check local-backend/test_task15_cloud_browser.mjs
            node --check local-backend/test_task15_pdf_js.mjs
            node --check local-backend/test_task16_d1_js.mjs
            node --check local-backend/test_finance_js.mjs
            node --check local-backend/test_task17_d1_js.mjs
            node --check local-backend/test_task18_d1_js.mjs
            node --check local-backend/test_task18_browser.mjs
            node --check local-backend/test_task20_d1_js.mjs
            node --check cloudflare/task14-cleanup-worker.mjs
            node --check local-backend/test_app_browser.mjs
            node --check local-backend/test_tools_browser.mjs
            node --check local-backend/test_module_graph_js.mjs
            node --check scripts/check_js_module_graph.mjs
            node --check scripts/check_storage_contract.mjs
            node --check scripts/task11_changelog_seed.mjs
            node --check scripts/task11_validate_import.mjs
            node --check scripts/check_task15_cloud_only.mjs
          } 2>&1 | tee artifacts/javascript-syntax.log

      - name: Check ES module dependency graph
        run: |
          set -euo pipefail
          node scripts/check_js_module_graph.mjs 2>&1 | tee artifacts/javascript-module-graph.log
          node local-backend/test_module_graph_js.mjs 2>&1 | tee artifacts/javascript-module-graph-self-test.log

      - name: Check frontend storage compatibility
        run: |
          set -euo pipefail
          node scripts/check_storage_contract.mjs 2>&1 | tee artifacts/frontend-storage-contract.log

      - name: Test JavaScript tools
        run: |
          set -euo pipefail
          node local-backend/test_tools_js.mjs 2>&1 | tee artifacts/javascript-tools.log

      - name: Test core JavaScript modules
        run: |
          set -euo pipefail
          node local-backend/test_core_js.mjs 2>&1 | tee artifacts/javascript-core.log

      - name: Test language JavaScript modules
        run: |
          set -euo pipefail
          node local-backend/test_language_js.mjs 2>&1 | tee artifacts/javascript-language.log

      - name: Test membership and admin modules
        shell: bash
        run: |
          set -euo pipefail
          node local-backend/test_membership_js.mjs 2>&1 | tee artifacts/javascript-membership.log

      - name: Test configurable tool workflows
        run: |
          set -euo pipefail
          node local-backend/test_workflows_js.mjs 2>&1 | tee artifacts/javascript-workflows.log

      - name: Test learning data sync client
        run: |
          set -euo pipefail
          node local-backend/test_learning_sync_js.mjs 2>&1 | tee artifacts/learning-sync-client.log

      - name: Test Pages API proxy
        run: |
          set -euo pipefail
          node local-backend/test_proxy_js.mjs 2>&1 | tee artifacts/pages-proxy.log

      - name: Test Cloudflare serverless foundation
        run: |
          set -euo pipefail
          mkdir -p .wrangler
          node local-backend/test_cloudflare_foundation_js.mjs 2>&1 | tee artifacts/cloudflare-foundation.log
          npx wrangler types .wrangler/ci-types.d.ts --env preview 2>&1 | tee artifacts/cloudflare-types.log
          npx wrangler pages functions build functions --outdir .wrangler/ci-functions 2>&1 | tee artifacts/cloudflare-functions-build.log
          npx wrangler d1 migrations apply WYJ_DB --local --config wrangler.local.jsonc --persist-to .wrangler/ci-state 2>&1 | tee artifacts/cloudflare-d1-migration.log

      - name: Test Task 11 routing and D1 integration
        run: |
          set -euo pipefail
          node local-backend/test_task11_model_js.mjs 2>&1 | tee artifacts/task11-model.log
          node local-backend/test_task11_api_js.mjs 2>&1 | tee artifacts/task11-routing.log
          node local-backend/test_task11_d1_js.mjs 2>&1 | tee artifacts/task11-cloud-integration.log

      - name: Test Task 12 account, session and identity integration
        run: |
          set -euo pipefail
          node local-backend/test_task12_d1_js.mjs 2>&1 | tee artifacts/task12-cloud-integration.log

      - name: Test Task 13 membership, payment and private QR integration
        run: |
          set -euo pipefail
          node local-backend/test_task13_d1_js.mjs 2>&1 | tee artifacts/task13-cloud-integration.log

      - name: Test Task 14 temporary sharing and private file integration
        run: |
          set -euo pipefail
          node local-backend/test_task14_d1_js.mjs 2>&1 | tee artifacts/task14-cloud-integration.log
          node -e "JSON.parse(require('fs').readFileSync('wrangler.task14-cleanup.jsonc','utf8'))" \
            2>&1 | tee artifacts/task14-cleanup-config.log

      - name: Test Task 15 cloud-only runtime and authentication isolation
        run: |
          set -euo pipefail
          node local-backend/test_task15_d1_js.mjs 2>&1 | tee artifacts/task15-cloud-integration.log
          node local-backend/test_task15_pdf_js.mjs 2>&1 | tee artifacts/task15-pdf.log
          node local-backend/test_task15_cloud_only_gate.mjs 2>&1 | tee artifacts/task15-cloud-only-gate-self-test.log
          node scripts/check_task15_cloud_only.mjs 2>&1 | tee artifacts/task15-cloud-only-gate.log

      - name: Test Task 16 finance core, reconciliation and D1 integration
        run: |
          set -euo pipefail
          node local-backend/test_task16_d1_js.mjs 2>&1 | tee artifacts/task16-cloud-integration.log

      - name: Test Task 17 finance web and membership integration
        run: |
          set -euo pipefail
          node local-backend/test_finance_js.mjs 2>&1 | tee artifacts/task17-finance-client.log
          node local-backend/test_task17_d1_js.mjs 2>&1 | tee artifacts/task17-finance-cloud-integration.log

      - name: Test Task 18 admin roles and in-app messages
        run: |
          set -euo pipefail
          node local-backend/test_task18_d1_js.mjs 2>&1 | tee artifacts/task18-admin-messages.log

      - name: Test Task 20 Android device sessions and security contract
        run: |
          set -euo pipefail
          node local-backend/test_task20_d1_js.mjs 2>&1 | tee artifacts/task20-device-sessions.log
          python scripts/check_task20_android.py 2>&1 | tee artifacts/task20-android-contract.log

      - name: Check HTML, PWA and tool catalog
        run: |
          set -euo pipefail
          cd local-backend
          python -m unittest test_static.py -v 2>&1 | tee ../artifacts/static-site.log

      - name: Check full functional audit coverage
        run: |
          set -euo pipefail
          python scripts/functional_audit_gate.py 2>&1 | tee artifacts/functional-audit-gate.log

      - name: Upload JavaScript and static reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: javascript-static-reports-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  sensitive-file-check:
    name: Sensitive files and static naming
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit repository contents
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/repository_audit.py 2>&1 | tee artifacts/repository-audit.log

      - name: Upload repository audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audit-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  android-tests:
    name: Android unit, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests, lint and debug build
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload Android reports and test APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports-${{ github.run_attempt }}
          path: |
            android-build.log
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  browser-tests:
    name: Browser flow (${{ matrix.suite }})
    needs:
      - python-tests
      - javascript-static-tests
      - sensitive-file-check
      - android-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: application
            script: local-backend/test_app_browser.mjs
    env:
      WYJ_TEST_BASE: http://127.0.0.1:8892
      WYJ_CDP_URL: http://127.0.0.1:9223
      VOCAB_STATIC_DIR: ${{ github.workspace }}
      OLLAMA_HOST: http://127.0.0.1:11435
      OLLAMA_TIMEOUT_SEC: "5"
      VOCAB_AI_QUEUE_TIMEOUT_SEC: "1"
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore browser-test download caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-browser-downloads-${{ hashFiles('**/requirements*.txt', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-browser-downloads-

      - name: Install independent toolbox artifact validators
        if: matrix.suite == 'toolbox'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r qa/requirements.txt

      - name: Prepare isolated browser data
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/wyj-browser-${{ matrix.suite }}"
          export VOCAB_USERS_DB="${runtime_root}/users.sqlite3"
          export VOCAB_USERS_TXT="${runtime_root}/users.txt"
          export VOCAB_PAYMENT_QR_DIR="${runtime_root}/payment/qrcodes"
          mkdir -p artifacts "$runtime_root" "$VOCAB_PAYMENT_QR_DIR"

          admin_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$admin_secret"
          {
            echo "VOCAB_USERS_DB=$VOCAB_USERS_DB"
            echo "VOCAB_USERS_TXT=$VOCAB_USERS_TXT"
            echo "VOCAB_PAYMENT_QR_DIR=$VOCAB_PAYMENT_QR_DIR"
            echo "VOCAB_ADMIN_SECRET=$admin_secret"
            echo "VOCAB_SHARE_HMAC_KEY=$admin_secret"
            echo "WYJ_TEST_ADMIN_SECRET=$admin_secret"
          } >> "$GITHUB_ENV"

          python - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("local-backend").resolve()))
          from membership import PURCHASABLE_PLAN_CODES
          from payment_assets import PAYMENT_METHODS

          pixel = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          root = Path(os.environ["VOCAB_PAYMENT_QR_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          for method in PAYMENT_METHODS:
              for plan_code in PURCHASABLE_PLAN_CODES:
                  (root / f"{method}_{plan_code}.png").write_bytes(pixel)
          print(f"Prepared {len(PAYMENT_METHODS) * len(PURCHASABLE_PLAN_CODES)} synthetic QR fixtures.")
          PY

      - name: Start isolated backend, AI fixture and headless Chrome
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_bin" ]]; then
            echo "No Chrome or Chromium executable is available on this runner." >&2
            exit 1
          fi

          python local-backend/ci_ollama_stub.py --host 127.0.0.1 --port 11435 \
            > "artifacts/ollama-fixture-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/ollama-fixture-${{ matrix.suite }}.pid"

          python local-backend/server.py --host 127.0.0.1 --port 8892 \
            > "artifacts/backend-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/backend-${{ matrix.suite }}.pid"

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --remote-allow-origins=* \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --user-data-dir="${RUNNER_TEMP}/wyj-chrome-${{ matrix.suite }}" \
            about:blank \
            > "artifacts/chrome-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/chrome-${{ matrix.suite }}.pid"

          python scripts/wait_for_http_services.py \
            --timeout 90 \
            --service "AI fixture=http://127.0.0.1:11435/api/tags" \
            --pid-file "AI fixture=artifacts/ollama-fixture-${{ matrix.suite }}.pid" \
            --log-file "AI fixture=artifacts/ollama-fixture-${{ matrix.suite }}.log" \
            --service "backend=http://127.0.0.1:8892/api/status" \
            --pid-file "backend=artifacts/backend-${{ matrix.suite }}.pid" \
            --log-file "backend=artifacts/backend-${{ matrix.suite }}.log" \
            --service "chrome=http://127.0.0.1:9223/json/version" \
            --pid-file "chrome=artifacts/chrome-${{ matrix.suite }}.pid" \
            --log-file "chrome=artifacts/chrome-${{ matrix.suite }}.log"

      - name: Run real browser flow
        env:
          WYJ_TEST_PYTHON: python
        run: |
          set -euo pipefail
          node "${{ matrix.script }}" 2>&1 | tee "artifacts/browser-${{ matrix.suite }}.log"

      - name: Stop isolated services
        if: always()
        run: |
          for pid_file in artifacts/*.pid; do
            [[ -f "$pid_file" ]] || continue
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.suite }}-reports-${{ github.run_attempt }}
          path: |
            artifacts/
            .tool-e2e/*.png
            .tool-e2e/qr-*.gif
            .tool-e2e/tool-artifacts-*.json
            .tool-e2e/downloads-*/**
          if-no-files-found: warn
          retention-days: 7

  cloud-only-browser-test:
    name: Cloud-only browser, canonical session and toolbox
    needs:
      - python-tests
      - javascript-static-tests
      - sensitive-file-check
      - android-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WYJ_TEST_BASE: http://127.0.0.1:8894
      WYJ_CDP_URL: http://127.0.0.1:9225
      WYJ_TEST_ARTIFACT_DIR: artifacts
      WYJ_TASK12_PASSWORD_PEPPER: task15-ci-password-pepper-fixture-2026
      WYJ_TASK14_TEMPORARY_SECRET: task15-ci-temporary-hmac-fixture-2026
      WYJ_TASK20_DEVICE_SESSION_SECRET: task20-ci-device-session-secret-fixture-2026
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python readiness helper
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Node download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-task15-cloud-browser-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-task15-cloud-browser-

      - name: Install pinned Cloudflare development tooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install independent toolbox artifact validators
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r qa/requirements.txt

      - name: Prepare fresh Cloudflare-only D1 state
        run: |
          set -euo pipefail
          mkdir -p artifacts "${RUNNER_TEMP}/task15-cloud-state"
          npx wrangler d1 migrations apply WYJ_DB \
            --local \
            --config wrangler.local.jsonc \
            --persist-to "${RUNNER_TEMP}/task15-cloud-state" \
            2>&1 | tee artifacts/task15-cloud-d1-migrations.log

      - name: Prepare isolated Cloudflare administrator fixture
        run: |
          set -euo pipefail
          admin_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$admin_secret"
          echo "WYJ_TEST_ADMIN_SECRET=$admin_secret" >> "$GITHUB_ENV"
          export WYJ_TEST_ADMIN_SECRET="$admin_secret"
          export WYJ_CI_ADMIN_SQL="${RUNNER_TEMP}/task15-cloud-admin.sql"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { hashSecret } from "./functions/_lib/task12-crypto.mjs";

          const now = new Date().toISOString();
          const hash = await hashSecret(
            process.env.WYJ_TEST_ADMIN_SECRET,
            process.env.WYJ_TASK12_PASSWORD_PEPPER,
          );
          const quote = (value) => `'${String(value).replaceAll("'", "''")}'`;
          fs.writeFileSync(process.env.WYJ_CI_ADMIN_SQL, `INSERT INTO task12_users (
            id, username, username_normalized, password_hash, password_scheme,
            password_iterations, role, registered_at, created_at, updated_at, source_updated_at
          ) VALUES (
            'task15-ci-super-admin', 'wyj', 'wyj', ${quote(hash)}, 'pbkdf2_sha256',
            310000, 'super_admin', ${quote(now)}, ${quote(now)}, ${quote(now)}, ${quote(now)}
          );\n`);
          JS
          npx wrangler d1 execute WYJ_DB \
            --local \
            --config wrangler.local.jsonc \
            --persist-to "${RUNNER_TEMP}/task15-cloud-state" \
            --file "$WYJ_CI_ADMIN_SQL" \
            2>&1 | tee artifacts/task15-cloud-admin-fixture.log

      - name: Start Pages Functions and headless Chrome without legacy services
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_bin" ]]; then
            echo "No Chrome or Chromium executable is available on this runner." >&2
            exit 1
          fi

          npx wrangler pages dev . \
            --ip 127.0.0.1 \
            --port 8894 \
            --persist-to "${RUNNER_TEMP}/task15-cloud-state" \
            --d1 WYJ_DB \
            --r2 WYJ_STORAGE \
            --show-interactive-dev-session false \
            --log-level info \
            --binding WYJ_ENVIRONMENT=development \
            --binding CLOUD_FOUNDATION_ENABLED=true \
            --binding CLOUD_STATUS_MODE=cloud \
            --binding CLOUD_READS_ENABLED=true \
            --binding CLOUD_WRITES_ENABLED=true \
            --binding TASK11_CLOUD_READS_ENABLED=true \
            --binding TASK11_CLOUD_WRITES_ENABLED=true \
            --binding TASK12_CLOUD_ACCOUNTS_ENABLED=true \
            --binding TASK13_CLOUD_READS_ENABLED=true \
            --binding TASK13_CLOUD_WRITES_ENABLED=true \
            --binding TASK13_PAYMENT_PRIMARY_ENABLED=true \
            --binding TASK14_CLOUD_READS_ENABLED=true \
            --binding TASK14_CLOUD_WRITES_ENABLED=true \
            --binding TASK14_TEMPORARY_PRIMARY_ENABLED=true \
            --binding TASK14_LEGACY_WRITES_FROZEN=true \
            --binding TASK15_CLOUD_ONLY_ENABLED=true \
            --binding TASK18_ADMIN_MESSAGES_ENABLED=true \
            --binding TASK20_ANDROID_APP_ENABLED=true \
            --binding WORKERS_AI_ENABLED=false \
            --binding LEGACY_API_FALLBACK_ENABLED=false \
            --binding WYJ_TASK12_PASSWORD_PEPPER="$WYJ_TASK12_PASSWORD_PEPPER" \
            --binding WYJ_TASK14_TEMPORARY_SECRET="$WYJ_TASK14_TEMPORARY_SECRET" \
            --binding WYJ_TASK20_DEVICE_SESSION_SECRET="$WYJ_TASK20_DEVICE_SESSION_SECRET" \
            > artifacts/task15-pages-dev.log 2>&1 < /dev/null &
          echo "$!" > artifacts/task15-pages-dev.pid

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --remote-allow-origins=* \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9225 \
            --user-data-dir="${RUNNER_TEMP}/task15-cloud-chrome" \
            about:blank \
            > artifacts/task15-chrome.log 2>&1 < /dev/null &
          echo "$!" > artifacts/task15-chrome.pid

          python scripts/wait_for_http_services.py \
            --timeout 90 \
            --service "Cloud-only Pages=http://127.0.0.1:8894/api/status?source=cloud" \
            --pid-file "Cloud-only Pages=artifacts/task15-pages-dev.pid" \
            --log-file "Cloud-only Pages=artifacts/task15-pages-dev.log" \
            --service "Chrome=http://127.0.0.1:9225/json/version" \
            --pid-file "Chrome=artifacts/task15-chrome.pid" \
            --log-file "Chrome=artifacts/task15-chrome.log"

      - name: Run cloud-only P0 browser flow
        run: |
          set -euo pipefail
          node local-backend/test_task15_cloud_browser.mjs 2>&1 | tee artifacts/task15-cloud-browser.log

      - name: Run Task 18 admin and message browser flow
        run: |
          set -euo pipefail
          node local-backend/test_task18_browser.mjs 2>&1 | tee artifacts/task18-browser.log

      - name: Run complete toolbox browser matrix on Cloudflare D1 and R2
        env:
          WYJ_TEST_PYTHON: python
        run: |
          set -euo pipefail
          node local-backend/test_tools_browser.mjs 2>&1 | tee artifacts/task15-cloud-toolbox.log

      - name: Stop Cloudflare-only browser fixtures
        if: always()
        run: |
          for pid_file in artifacts/task15-*.pid; do
            [[ -f "$pid_file" ]] || continue
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload cloud-only browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task15-cloud-browser-reports-${{ github.run_attempt }}
          path: |
            artifacts/
            .tool-e2e/*.png
            .tool-e2e/qr-*.gif
            .tool-e2e/tool-artifacts-*.json
            .tool-e2e/downloads-*/**
          if-no-files-found: warn
          retention-days: 7
