name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-tests:
    name: Python syntax and unittest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Python download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-downloads-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-downloads-

      - name: Check Python syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            python -m compileall -q local-backend scripts qa
            echo "Python syntax check passed."
          } 2>&1 | tee artifacts/python-syntax.log

      - name: Run Python unittest suite
        run: |
          set -euo pipefail
          cd local-backend
          python -m unittest discover -p "test_*.py" -v 2>&1 | tee ../artifacts/python-unittest.log

      - name: Test CI service readiness helper
        run: |
          set -euo pipefail
          python -m unittest scripts.test_wait_for_http_services -v 2>&1 | tee artifacts/ci-readiness.log

      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-reports-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  javascript-static-tests:
    name: JavaScript and static site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Node download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-downloads-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-downloads-

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            node --check app.js
            while IFS= read -r module; do node --check "$module"; done < <(find js -type f -name '*.js' -print | sort)
            node --check tools.js
            node --check workflows.js
            node --check learning-sync.js
            node --check sw.js
            node --check "functions/api/[[path]].js"
            node --check local-backend/test_tools_js.mjs
            node --check local-backend/test_core_js.mjs
            node --check local-backend/test_language_js.mjs
            node --check local-backend/test_membership_js.mjs
            node --check local-backend/test_workflows_js.mjs
            node --check local-backend/test_learning_sync_js.mjs
            node --check local-backend/test_proxy_js.mjs
            node --check local-backend/test_app_browser.mjs
            node --check local-backend/test_tools_browser.mjs
          } 2>&1 | tee artifacts/javascript-syntax.log

      - name: Test JavaScript tools
        run: |
          set -euo pipefail
          node local-backend/test_tools_js.mjs 2>&1 | tee artifacts/javascript-tools.log

      - name: Test core JavaScript modules
        run: |
          set -euo pipefail
          node local-backend/test_core_js.mjs 2>&1 | tee artifacts/javascript-core.log

      - name: Test language JavaScript modules
        run: |
          set -euo pipefail
          node local-backend/test_language_js.mjs 2>&1 | tee artifacts/javascript-language.log

      - name: Test membership and admin modules
        shell: bash
        run: |
          set -euo pipefail
          node local-backend/test_membership_js.mjs 2>&1 | tee artifacts/javascript-membership.log

      - name: Test configurable tool workflows
        run: |
          set -euo pipefail
          node local-backend/test_workflows_js.mjs 2>&1 | tee artifacts/javascript-workflows.log

      - name: Test learning data sync client
        run: |
          set -euo pipefail
          node local-backend/test_learning_sync_js.mjs 2>&1 | tee artifacts/learning-sync-client.log

      - name: Test Pages API proxy
        run: |
          set -euo pipefail
          node local-backend/test_proxy_js.mjs 2>&1 | tee artifacts/pages-proxy.log

      - name: Check HTML, PWA and tool catalog
        run: |
          set -euo pipefail
          cd local-backend
          python -m unittest test_static.py -v 2>&1 | tee ../artifacts/static-site.log

      - name: Check full functional audit coverage
        run: |
          set -euo pipefail
          python scripts/functional_audit_gate.py 2>&1 | tee artifacts/functional-audit-gate.log

      - name: Upload JavaScript and static reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: javascript-static-reports-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  sensitive-file-check:
    name: Sensitive files and static naming
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit repository contents
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/repository_audit.py 2>&1 | tee artifacts/repository-audit.log

      - name: Upload repository audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-audit-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  browser-tests:
    name: Browser flow (${{ matrix.suite }})
    needs:
      - python-tests
      - javascript-static-tests
      - sensitive-file-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: application
            script: local-backend/test_app_browser.mjs
          - suite: toolbox
            script: local-backend/test_tools_browser.mjs
    env:
      WYJ_TEST_BASE: http://127.0.0.1:8892
      WYJ_CDP_URL: http://127.0.0.1:9223
      VOCAB_STATIC_DIR: ${{ github.workspace }}
      OLLAMA_HOST: http://127.0.0.1:11435
      OLLAMA_TIMEOUT_SEC: "5"
      VOCAB_AI_QUEUE_TIMEOUT_SEC: "1"
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore browser-test download caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-browser-downloads-${{ hashFiles('**/requirements*.txt', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-browser-downloads-

      - name: Install independent toolbox artifact validators
        if: matrix.suite == 'toolbox'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r qa/requirements.txt

      - name: Prepare isolated browser data
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/wyj-browser-${{ matrix.suite }}"
          export VOCAB_USERS_DB="${runtime_root}/users.sqlite3"
          export VOCAB_USERS_TXT="${runtime_root}/users.txt"
          export VOCAB_PAYMENT_QR_DIR="${runtime_root}/payment/qrcodes"
          mkdir -p artifacts "$runtime_root" "$VOCAB_PAYMENT_QR_DIR"

          admin_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$admin_secret"
          {
            echo "VOCAB_USERS_DB=$VOCAB_USERS_DB"
            echo "VOCAB_USERS_TXT=$VOCAB_USERS_TXT"
            echo "VOCAB_PAYMENT_QR_DIR=$VOCAB_PAYMENT_QR_DIR"
            echo "VOCAB_ADMIN_SECRET=$admin_secret"
            echo "VOCAB_SHARE_HMAC_KEY=$admin_secret"
            echo "WYJ_TEST_ADMIN_SECRET=$admin_secret"
          } >> "$GITHUB_ENV"

          python - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("local-backend").resolve()))
          from membership import PURCHASABLE_PLAN_CODES
          from payment_assets import PAYMENT_METHODS

          pixel = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          root = Path(os.environ["VOCAB_PAYMENT_QR_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          for method in PAYMENT_METHODS:
              for plan_code in PURCHASABLE_PLAN_CODES:
                  (root / f"{method}_{plan_code}.png").write_bytes(pixel)
          print(f"Prepared {len(PAYMENT_METHODS) * len(PURCHASABLE_PLAN_CODES)} synthetic QR fixtures.")
          PY

      - name: Start isolated backend, AI fixture and headless Chrome
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_bin" ]]; then
            echo "No Chrome or Chromium executable is available on this runner." >&2
            exit 1
          fi

          python local-backend/ci_ollama_stub.py --host 127.0.0.1 --port 11435 \
            > "artifacts/ollama-fixture-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/ollama-fixture-${{ matrix.suite }}.pid"

          python local-backend/server.py --host 127.0.0.1 --port 8892 \
            > "artifacts/backend-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/backend-${{ matrix.suite }}.pid"

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --remote-allow-origins=* \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --user-data-dir="${RUNNER_TEMP}/wyj-chrome-${{ matrix.suite }}" \
            about:blank \
            > "artifacts/chrome-${{ matrix.suite }}.log" \
            2>&1 < /dev/null &
          echo "$!" > "artifacts/chrome-${{ matrix.suite }}.pid"

          python scripts/wait_for_http_services.py \
            --timeout 90 \
            --service "AI fixture=http://127.0.0.1:11435/api/tags" \
            --pid-file "AI fixture=artifacts/ollama-fixture-${{ matrix.suite }}.pid" \
            --log-file "AI fixture=artifacts/ollama-fixture-${{ matrix.suite }}.log" \
            --service "backend=http://127.0.0.1:8892/api/status" \
            --pid-file "backend=artifacts/backend-${{ matrix.suite }}.pid" \
            --log-file "backend=artifacts/backend-${{ matrix.suite }}.log" \
            --service "chrome=http://127.0.0.1:9223/json/version" \
            --pid-file "chrome=artifacts/chrome-${{ matrix.suite }}.pid" \
            --log-file "chrome=artifacts/chrome-${{ matrix.suite }}.log"

      - name: Run real browser flow
        env:
          WYJ_TEST_PYTHON: python
        run: |
          set -euo pipefail
          node "${{ matrix.script }}" 2>&1 | tee "artifacts/browser-${{ matrix.suite }}.log"

      - name: Stop isolated services
        if: always()
        run: |
          for pid_file in artifacts/*.pid; do
            [[ -f "$pid_file" ]] || continue
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.suite }}-reports-${{ github.run_attempt }}
          path: |
            artifacts/
            .tool-e2e/*.png
            .tool-e2e/qr-*.gif
            .tool-e2e/tool-artifacts-*.json
            .tool-e2e/downloads-*/**
          if-no-files-found: warn
          retention-days: 7
