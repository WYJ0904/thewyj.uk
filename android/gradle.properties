# Gradle 9.4 worker @argfiles must match the Windows native charset for the
# fixed Chinese checkout path (gradle/gradle#30304). COMPAT selects the native
# charset; Linux/macOS retain UTF-8. Source files remain UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP registers generated sources through kotlin.sourceSets; AGP 9's built-in
# Kotlin plugin rejects that unless this compatibility flag is set.
android.disallowKotlinSourceSets=false
# The fixed Windows checkout contains Chinese characters. AGP's path warning
# otherwise stops before compilation; validate the real build at this path.
android.overridePathCheck=true
